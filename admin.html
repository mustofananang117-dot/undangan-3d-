<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Panel Admin Undangan 3D</title>
    <style>
        body { font-family: sans-serif; padding: 20px; background: #0f172a; color: #fff; }
        .card { background: #1e293b; padding: 20px; border-radius: 8px; max-width: 500px; margin: auto; }
        input, select, button { width: 100%; padding: 10px; margin: 8px 0; border-radius: 4px; border: none; }
        button { background: #8b5cf6; color: white; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>
    <div class="card">
        <h2>Link Generator Tamu</h2>
        <label>Nama Tamu:</label>
        <input type="text" id="admin-guest-name" placeholder="Contoh: Budi Santoso">
        
        <label>Kategori Akses:</label>
        <select id="admin-guest-seat">
            <option value="VIP">VIP</option>
            <option value="Reguler">Reguler</option>
            <option value="Keluarga">Keluarga</option>
        </select>
        
        <button onclick="generateLink()">Buat Tautan Unik</button>

        <h3>Hasil Tautan:</h3>
        <input type="text" id="result-link" readonly>
    </div>

    <script>
        function generateLink() {
            const name = encodeURIComponent(document.getElementById("admin-guest-name").value);
            const seat = document.getElementById("admin-guest-seat").value;
            const baseUrl = window.location.origin + window.location.pathname.replace("admin.html", "index.html");
            const finalUrl = `${baseUrl}?to=${name}&seat=${seat}`;
            document.getElementById("result-link").value = finalUrl;
        }
    </script>
</body>
</html>
